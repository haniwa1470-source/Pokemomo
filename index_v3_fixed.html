<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>改造ファイアレッド 努力値セーブ編集 v3</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box} body{margin:0;background:#0b1020;color:#eef2ff}.wrap{max-width:1180px;margin:auto;padding:20px}
h1{font-size:25px;margin:0 0 6px}.sub{color:#a5b4fc;font-size:13px;line-height:1.55;margin-bottom:16px}.card{background:#11182b;border:1px solid #28344f;border-radius:16px;padding:14px;margin-bottom:14px}.loadgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.filebox{border:1px dashed #465573;border-radius:12px;padding:12px}.filebox b{display:block;margin-bottom:8px}.status{font-size:13px;color:#b8c2d9;margin-top:8px;white-space:pre-wrap}.ok{color:#86efac}.warn{color:#fbbf24}.bad{color:#fda4af}.layout{display:grid;grid-template-columns:380px 1fr;gap:14px}.tabs{display:flex;gap:8px;margin-bottom:10px}.tabs button,.btn{border:1px solid #3d4c6a;background:#172036;color:#eef2ff;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer}.tabs button.active{background:#e0e7ff;color:#111827;border-color:#e0e7ff}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}select,input[type=number],input[type=text]{background:#0d1426;color:#fff;border:1px solid #3b4965;border-radius:9px;padding:10px;font-size:16px}select{width:100%}.list{max-height:620px;overflow:auto;border:1px solid #293650;border-radius:12px;background:#0d1426}.row{padding:11px 12px;border-bottom:1px solid #202c44;cursor:pointer;display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:center}.row:last-child{border-bottom:0}.row:hover,.row.active{background:#1a2742}.slot{font-size:12px;color:#93a4c7}.name{font-weight:800}.meta{font-size:12px;color:#a7b3ca;margin-top:3px}.evsum{font-size:12px;color:#c4b5fd}.empty{padding:24px;text-align:center;color:#94a3b8}.titleline{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.pkname{font-size:25px;font-weight:900}.small{font-size:12px;color:#9caecb}.evgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.ev{background:#0d1426;border:1px solid #293650;border-radius:12px;padding:12px}.ev label{display:block;font-size:13px;color:#a8b5ce;margin-bottom:7px}.ev input{width:100%;font-size:20px;font-weight:800}.sumline{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:12px;background:#0d1426;border-radius:11px}.sumvalue{font-size:22px;font-weight:900}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.primary{background:#e0e7ff;color:#111827;border-color:#e0e7ff}.danger{background:#3a1620;border-color:#7f1d1d}.note{font-size:12px;line-height:1.6;color:#9ba9c2}.hidden{display:none!important}
@media(max-width:820px){.loadgrid,.layout{grid-template-columns:1fr}.list{max-height:420px}.evgrid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<h1>改造ファイアレッド 努力値セーブ編集 <span style="font-size:14px;color:#a5b4fc">v3</span></h1>
<div class="sub">この改造BPRJ ROM用。ROMから種族名を読み、.sav内の手持ち/BOXポケモンの現在EVを表示して、H/A/B/C/D/Sを指定値へ上書きします。</div>

<div class="card loadgrid">
  <div class="filebox"><b>① ROM (.gba)</b><input id="romFile" type="file" accept=".gba,application/octet-stream"><div id="romStatus" class="status">未読込</div></div>
  <div class="filebox"><b>② セーブ (.sav)</b><input id="savFile" type="file" accept=".sav,application/octet-stream"><div id="savStatus" class="status">未読込</div></div>
</div>

<div id="main" class="layout hidden">
  <div class="card">
    <div class="tabs"><button id="partyTab" class="active">手持ち</button><button id="boxTab">BOX</button></div>
    <div id="boxChooser" class="toolbar hidden"><select id="boxSelect"></select></div>
    <div id="monList" class="list"></div>
  </div>

  <div class="card">
    <div id="detail" class="empty">左からポケモンを選択してください。</div>
  </div>
</div>

<div class="card">
  <div class="actions"><button id="downloadBtn" class="btn primary" disabled>編集済み .sav を保存</button></div>
  <div id="editStatus" class="status">変更はまだありません。</div>
  <div class="note">※ 元の.sav自体は書き換えません。必ず別名で保存します。<br>※ 1能力0〜252、合計510までに制限しています。<br>※ まず手持ち/BOXの現在EVが正しく読めているか確認してから書き出してください。</div>
</div>
</div>

<script>
const $=s=>document.getElementById(s)||document.querySelector(s);
let ROM=null,SAV=null,originalSavName='save.sav',speciesNames=[],growthRates=[];
let slotInfo=null,mode='party',selected=null,editCount=0;
const SEC_SIZE=0x1000, DATA_SIZE=0xF80, SIG=0x08012025;
const EVN=['H','A','B','S','C','D'];
const PERM=[
[0,1,2,3],[0,1,3,2],[0,2,1,3],[0,3,1,2],[0,2,3,1],[0,3,2,1],
[1,0,2,3],[1,0,3,2],[2,0,1,3],[3,0,1,2],[2,0,3,1],[3,0,2,1],
[1,2,0,3],[1,3,0,2],[2,1,0,3],[3,1,0,2],[2,3,0,1],[3,2,0,1],
[1,2,3,0],[1,3,2,0],[2,1,3,0],[3,1,2,0],[2,3,1,0],[3,2,1,0]
];
const rows=[
"　あいうえおかきくけこさしすせそ","たちつてとなにぬねのはひふへほま",
"みむめもやゆよらりるれろわをんぁ","ぃぅぇぉゃゅょがぎぐげござじずぜ",
"ぞだぢづでどばびぶべぼぱぴぷぺぽ","っアイウエオカキクケコサシスセソ",
"タチツテトナニヌネノハヒフヘホマ","ミムメモヤユヨラリルレロワヲンァ",
"ィゥェォャュョガギグゲゴザジズゼ","ゾダヂヅデドバビブベボパピプペポ",
"ッ０１２３４５６７８９！？。ー・","‥『』「」♂♀円．×／ＡＢＣＤＥ",
"ＦＧＨＩＪＫＬＭＮＯＰＱＲＳＴＵ","ＶＷＸＹＺａｂｃｄｅｆｇｈｉｊｋ",
"ｌｍｎｏｐｑｒｓｔｕｖｗｘｙｚ►"];
const cmap={};rows.forEach((r,y)=>[...r].forEach((c,x)=>cmap[(y<<4)|x]=c));
function rd16(a,o){return (a[o]|a[o+1]<<8)>>>0}function wr16(a,o,v){a[o]=v&255;a[o+1]=(v>>>8)&255}
function rd32(a,o){return (a[o]|a[o+1]<<8|a[o+2]<<16|a[o+3]<<24)>>>0}function wr32(a,o,v){a[o]=v&255;a[o+1]=(v>>>8)&255;a[o+2]=(v>>>16)&255;a[o+3]=(v>>>24)&255}
function decodeText(a,o,len){let s='';for(let i=0;i<len;i++){const b=a[o+i];if(b===0xFF)break;s+=cmap[b]??''}return s}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function encodeJP(s){const rev={};for(const [k,v] of Object.entries(cmap))rev[v]=+k;return [...s].map(c=>rev[c]).filter(x=>x!==undefined)}
function findSeq(a,seq,start=0){outer:for(let i=start;i<=a.length-seq.length;i++){for(let j=0;j<seq.length;j++)if(a[i+j]!==seq[j])continue outer;return i}return-1}
function readFile(input,cb){const f=input.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>cb(f,new Uint8Array(r.result));r.readAsArrayBuffer(f)}

function parseROM(){
 if(!ROM||ROM.length<0x200000)throw Error('ROMサイズが小さすぎます。');
 const code=new TextDecoder('ascii').decode(ROM.slice(0xAC,0xB0));
 if(code!=='BPRJ')throw Error('BPRJ（日本版ファイアレッド系）ROMとして認識できません。');
 const seq=encodeJP('フシギダネ');let p=findSeq(ROM,seq),base=-1;
 while(p>=0){const b=p-8;if(b>=0&&decodeText(ROM,p,8)==='フシギダネ'&&decodeText(ROM,p+8,8)==='フシギソウ'&&decodeText(ROM,p+16,8)==='フシギバナ'){base=b;break}p=findSeq(ROM,seq,p+1)}
 if(base<0)throw Error('拡張種族名テーブルを検出できません。');
 speciesNames=[];
 for(let id=0;id<2500;id++){const o=base+id*8;if(o+8>ROM.length)break;const name=decodeText(ROM,o,8);const raw=ROM.slice(o,o+8);if(id>0&&(!name||![...raw].includes(0xFF)))break;speciesNames[id]=name||`ID ${id}`}
 // This ROM family has expanded base stats at 0x19B8B40, 32 bytes/species including dummy 0.
 growthRates=[];const stats=0x19B8B40;
 if(stats+speciesNames.length*32<=ROM.length){
   for(let id=0;id<speciesNames.length;id++)growthRates[id]=ROM[stats+id*32+19];
 }
 return speciesNames.length-1;
}

function sectorMapForSlot(slotBase){
 const map=new Map(),counters=[];let sigs=0;
 for(let i=0;i<14;i++){const o=slotBase+i*SEC_SIZE,id=rd16(SAV,o+0xFF4),sig=rd32(SAV,o+0xFF8),ctr=rd32(SAV,o+0xFFC);if(sig===SIG&&id<14){map.set(id,o);counters.push(ctr);sigs++}}
 const unique=[...new Set(counters)];
 return {base:slotBase,map,sigs,counter:unique.length?Math.max(...unique):0,uniqueCounters:unique};
}
function newer(a,b){if(a===0xFFFFFFFF&&b===0)return false;if(b===0xFFFFFFFF&&a===0)return true;return a>b}
function parseSave(){
 if(!SAV||SAV.length<0x1C000)throw Error('128KB系のGBAセーブとして短すぎます。');
 const a=sectorMapForSlot(0),b=sectorMapForSlot(14*SEC_SIZE);
 const validA=a.map.size===14, validB=b.map.size===14;
 if(!validA&&!validB)throw Error('FireRed系の14セクタ構造を検出できません。');
 slotInfo=validA&&validB?(newer(a.counter,b.counter)?a:b):(validA?a:b);
 if(!slotInfo.map.has(1))throw Error('手持ちセクタを検出できません。');
 return slotInfo;
}

function decryptBoxMon(abs){
 const personality=rd32(SAV,abs),otid=rd32(SAV,abs+4),key=(personality^otid)>>>0;
 const dec=new Uint8Array(48);
 for(let i=0;i<48;i+=4)wr32(dec,i,(rd32(SAV,abs+32+i)^key)>>>0);
 const perm=PERM[personality%24];
 // PERM は「物理ブロック0..3に、G/A/E/Mのどれが入っているか」を表す。
 // したがって各論理サブ構造の位置は値そのものではなく indexOf() で求める。
 const g=perm.indexOf(0)*12,e=perm.indexOf(2)*12,m=perm.indexOf(3)*12;
 const species=rd16(dec,g),exp=rd32(dec,g+4),ev=[dec[e],dec[e+1],dec[e+2],dec[e+3],dec[e+4],dec[e+5]];
 const ivWord=rd32(dec,m+4),ivs=[ivWord&31,(ivWord>>>5)&31,(ivWord>>>10)&31,(ivWord>>>15)&31,(ivWord>>>20)&31,(ivWord>>>25)&31];
 const nick=decodeText(SAV,abs+8,10);
 return {abs,personality,otid,key,dec,perm,g,e,m,species,exp,ev,ivs,nick};
}
function monChecksum(dec){let s=0;for(let i=0;i<48;i+=2)s=(s+rd16(dec,i))&0xFFFF;return s}
function encryptBack(mon){
 wr16(SAV,mon.abs+28,monChecksum(mon.dec));
 for(let i=0;i<48;i+=4)wr32(SAV,mon.abs+32+i,(rd32(mon.dec,i)^mon.key)>>>0);
}
function speciesName(id){return speciesNames[id]||`内部ID ${id}`}

function expForLevel(n,g){
 const n3=n*n*n;
 switch(g){
 case 1: if(n<=50)return Math.floor(n3*(100-n)/50);if(n<=68)return Math.floor(n3*(150-n)/100);if(n<=98)return Math.floor(n3*Math.floor((1911-10*n)/3)/500);return Math.floor(n3*(160-n)/100);
 case 2: if(n<=15)return Math.floor(n3*(Math.floor((n+1)/3)+24)/50);if(n<=36)return Math.floor(n3*(n+14)/50);return Math.floor(n3*(Math.floor(n/2)+32)/50);
 case 3:return Math.floor((6*n3)/5-15*n*n+100*n-140);
 case 4:return Math.floor(4*n3/5);
 case 5:return Math.floor(5*n3/4);
 default:return n3;
 }
}
function levelFromExp(species,exp){const g=growthRates[species];if(g===undefined)return '?';let lv=1;for(let n=2;n<=100;n++){if(exp>=expForLevel(n,g))lv=n;else break}return lv}

function partyMons(){
 const sec=slotInfo.map.get(1),count=Math.min(SAV[sec+0x34],6),out=[];
 for(let i=0;i<count;i++){const abs=sec+0x38+i*100,mon=decryptBoxMon(abs);if(mon.species)out.push({...mon,where:'party',slot:i,level:SAV[abs+84]})}
 return out;
}
function storageLogicalToAbs(off){const secId=5+Math.floor(off/DATA_SIZE),within=off%DATA_SIZE,sec=slotInfo.map.get(secId);if(sec===undefined)return-1;return sec+within}
function boxMons(box){const out=[];for(let s=0;s<30;s++){const logical=4+(box*30+s)*80,abs=storageLogicalToAbs(logical);if(abs<0)continue;const mon=decryptBoxMon(abs);if(mon.species)out.push({...mon,where:'box',box,slot:s,level:levelFromExp(mon.species,mon.exp)})}return out}
function boxName(box){
 const logical=0x8344+box*9,abs=storageLogicalToAbs(logical);if(abs<0)return`BOX ${box+1}`;return decodeText(SAV,abs,9)||`BOX ${box+1}`
}
function currentMons(){return mode==='party'?partyMons():boxMons(+$('boxSelect').value)}

function renderBoxChooser(){const s=$('boxSelect');s.innerHTML='';for(let i=0;i<14;i++){const o=document.createElement('option');o.value=i;o.textContent=`${i+1}. ${boxName(i)}`;s.append(o)}}
function renderList(){
 const mons=currentMons(),el=$('monList');el.innerHTML='';
 if(!mons.length){el.innerHTML='<div class="empty">ポケモンがいません。</div>';return}
 mons.forEach(m=>{const r=document.createElement('div');r.className='row'+(selected&&selected.abs===m.abs?' active':'');const evsum=m.ev.reduce((a,b)=>a+b,0);r.innerHTML=`<div class="slot">${m.where==='party'?`手持ち${m.slot+1}`:`#${m.slot+1}`}</div><div><div class="name">${esc(speciesName(m.species))} <span class="small">Lv${m.level}</span></div><div class="meta">${m.nick&&m.nick!==speciesName(m.species)?`NN: ${esc(m.nick)}　`:''}EV H${m.ev[0]} A${m.ev[1]} B${m.ev[2]} C${m.ev[4]} D${m.ev[5]} S${m.ev[3]}</div></div><div class="evsum">計${evsum}</div>`;r.onclick=()=>{selected=m;renderList();renderDetail(m)};el.append(r)})
}
function renderDetail(m){
 const order=[0,1,2,4,5,3]; // H A B C D S
 const labels=['H','A','B','C','D','S'];
 $('detail').className='';$('detail').innerHTML=`<div class="titleline"><div><div class="pkname">${esc(speciesName(m.species))}</div><div class="small">${m.where==='party'?`手持ち ${m.slot+1}`:`${esc(boxName(m.box))} / ${m.slot+1}枠目`}　Lv${m.level}　種族ID ${m.species}</div></div><div class="small">個体値 H${m.ivs[0]} A${m.ivs[1]} B${m.ivs[2]} C${m.ivs[4]} D${m.ivs[5]} S${m.ivs[3]}</div></div><div class="evgrid">${order.map((idx,j)=>`<div class="ev"><label>${labels[j]} 努力値</label><input class="evin" data-idx="${idx}" type="number" min="0" max="252" step="1" value="${m.ev[idx]}"></div>`).join('')}</div><div class="sumline"><span>合計</span><span id="evTotal" class="sumvalue">${m.ev.reduce((a,b)=>a+b,0)} / 510</span></div><div id="detailWarn" class="status"></div><div class="actions"><button id="applyBtn" class="btn primary">この値で上書き</button><button id="zeroBtn" class="btn">全て0</button></div>`;
 document.querySelectorAll('.evin').forEach(x=>x.oninput=updateTotal);$('applyBtn').onclick=applyEV;$('zeroBtn').onclick=()=>{document.querySelectorAll('.evin').forEach(x=>x.value=0);updateTotal()};
}
function getInputs(){const arr=[0,0,0,0,0,0];document.querySelectorAll('.evin').forEach(x=>arr[+x.dataset.idx]=Math.max(0,Math.min(252,Math.trunc(+x.value||0))));return arr}
function updateTotal(){const ev=getInputs(),t=ev.reduce((a,b)=>a+b,0);$('evTotal').textContent=`${t} / 510`;$('detailWarn').textContent=t>510?'合計510を超えています。':'';$('detailWarn').className='status '+(t>510?'bad':'')}
function applyEV(){
 if(!selected)return;const ev=getInputs(),total=ev.reduce((a,b)=>a+b,0);if(total>510){$('detailWarn').textContent='合計510以下にしてください。';$('detailWarn').className='status bad';return}
 // Re-read from SAV to avoid using stale decrypted data.
 const m=decryptBoxMon(selected.abs);for(let i=0;i<6;i++)m.dec[m.e+i]=ev[i];encryptBack(m);
 // Update save-sector checksum containing this mon.
 const secAbs=Math.floor(selected.abs/SEC_SIZE)*SEC_SIZE,secId=rd16(SAV,secAbs+0xFF4);updateSectorChecksum(secAbs,secId);
 editCount++;$('downloadBtn').disabled=false;$('editStatus').textContent=`${editCount}回編集しました。書き出すまで元ファイルには影響しません。`;$('editStatus').className='status ok';
 // Refresh selected object/readback.
 const refreshed=decryptBoxMon(selected.abs);selected={...selected,...refreshed,ev:[...refreshed.ev]};renderList();renderDetail(selected);
}
function checksum32fold(a,off,size){let s=0>>>0;for(let i=0;i<Math.floor(size/4);i++)s=(s+rd32(a,off+i*4))>>>0;return ((s>>>16)+(s&0xFFFF))&0xFFFF}
function sectionDataSize(id){if(id>=1&&id<=4)return DATA_SIZE;if(id>=5&&id<=12)return DATA_SIZE;if(id===13)return 0x7D0;return DATA_SIZE}
function updateSectorChecksum(secAbs,id){const size=sectionDataSize(id);wr16(SAV,secAbs+0xFF6,checksum32fold(SAV,secAbs,size))}

function showMainIfReady(){if(ROM&&SAV&&slotInfo){$('main').classList.remove('hidden');renderBoxChooser();renderList()}}
$('romFile').onchange=()=>readFile($('romFile'),(f,a)=>{try{ROM=a;const n=parseROM();$('romStatus').textContent=`読込OK：${f.name}\n種族名 ${n}件を検出`;$('romStatus').className='status ok';showMainIfReady()}catch(e){ROM=null;$('romStatus').textContent='エラー：'+e.message;$('romStatus').className='status bad'}});
$('savFile').onchange=()=>readFile($('savFile'),(f,a)=>{try{SAV=new Uint8Array(a);originalSavName=f.name;const s=parseSave();$('savStatus').textContent=`読込OK：${f.name}\n使用セーブ枠 counter=${s.counter}`;$('savStatus').className='status ok';selected=null;editCount=0;$('downloadBtn').disabled=true;showMainIfReady()}catch(e){SAV=null;slotInfo=null;$('savStatus').textContent='エラー：'+e.message;$('savStatus').className='status bad'}});
$('partyTab').onclick=()=>{mode='party';selected=null;$('partyTab').classList.add('active');$('boxTab').classList.remove('active');$('boxChooser').classList.add('hidden');$('detail').className='empty';$('detail').textContent='左からポケモンを選択してください。';renderList()};
$('boxTab').onclick=()=>{mode='box';selected=null;$('boxTab').classList.add('active');$('partyTab').classList.remove('active');$('boxChooser').classList.remove('hidden');$('detail').className='empty';$('detail').textContent='左からポケモンを選択してください。';renderList()};
$('boxSelect').onchange=()=>{selected=null;$('detail').className='empty';$('detail').textContent='左からポケモンを選択してください。';renderList()};
$('downloadBtn').onclick=()=>{if(!SAV)return;const blob=new Blob([SAV],{type:'application/octet-stream'}),a=document.createElement('a'),u=URL.createObjectURL(blob);const base=originalSavName.replace(/\.sav$/i,'');a.href=u;a.download=base+'_EV編集.sav';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)};
</script>
</body>
</html>
