.heroBox::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,.16) 100%)}

.loadgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.ev label{display:block;color:var(--muted);font-weight:400;margin-bottom:8px}
.ev input,.ev select{width:100%;font-size:24px;font-weight:400;padding:10px;border-radius:4px;border:3px solid #7b9020;background:#fffef3;color:var(--text);font-family:"DotGothic16","MS Gothic","Osaka-Mono",monospace}

.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
button{font:inherit}

.btn.primary{background:linear-gradient(180deg,#b2cb40,#8ea826);color:#ffffff;border-color:#586715}
.btn.danger{background:linear-gradient(180deg,#f7d9d3,#eaa79c);border-color:#8d4c40;color:#53261f}
.btn:disabled{opacity:.45}

  .loadgrid{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(2,1fr)}
  h1{font-size:24px;padding:12px 14px}
  .heroBox{height:150px}

<body>
<div class="wrap">
<div class="topLoad">
  <div class="filebox"><b>① ROM (.gba)</b><input id="romFile" type="file" accept=".gba,application/octet-stream"><div id="romStatus" class="status">未読込</div></div>
  <div class="filebox"><b>② セーブ (.sav)</b><input id="savFile" type="file" accept=".sav,application/octet-stream"><div id="savStatus" class="status">未読込</div></div>
</div>
<div id="main" class="hidden">
  <div class="card chooseCard"><h2>③ ポケモンを選択</h2><div id="monList" class="list"></div></div>
  <div id="editorCard" class="card hidden">
    <div class="selectedBar">
      <div><div id="selectedTitle" class="selectedTitle"></div><div id="selectedMeta" class="meta"></div></div>
      <div class="friendCompact"><label>なつき度</label><input id="friendship" inputmode="numeric" type="number" min="0" max="255"></div>
    </div>
    <h2 class="statusHeading">④ ステータス編集</h2>
    <div class="statusColumns">
      <section class="statSection"><h3>努力値（EV）</h3><div class="miniGrid">
        <div class="mini"><label>H</label><input id="evH" inputmode="numeric" type="number" min="0" max="252"></div>
        <div class="mini"><label>A</label><input id="evA" inputmode="numeric" type="number" min="0" max="252"></div>
        <div class="mini"><label>B</label><input id="evB" inputmode="numeric" type="number" min="0" max="252"></div>
        <div class="mini"><label>C</label><input id="evC" inputmode="numeric" type="number" min="0" max="252"></div>
        <div class="mini"><label>D</label><input id="evD" inputmode="numeric" type="number" min="0" max="252"></div>
        <div class="mini"><label>S</label><input id="evS" inputmode="numeric" type="number" min="0" max="252"></div>
      </div><div class="summary"><div class="pill">合計 <b id="evTotal">0</b> / 510</div><div class="pill">残り <b id="evRemain">510</b></div></div></section>
      <section class="statSection"><h3>個体値（IV）</h3><div class="miniGrid">
        <div class="mini"><label>H</label><input id="ivH" inputmode="numeric" type="number" min="0" max="31"></div>
        <div class="mini"><label>A</label><input id="ivA" inputmode="numeric" type="number" min="0" max="31"></div>
        <div class="mini"><label>B</label><input id="ivB" inputmode="numeric" type="number" min="0" max="31"></div>
        <div class="mini"><label>C</label><input id="ivC" inputmode="numeric" type="number" min="0" max="31"></div>
        <div class="mini"><label>D</label><input id="ivD" inputmode="numeric" type="number" min="0" max="31"></div>
        <div class="mini"><label>S</label><input id="ivS" inputmode="numeric" type="number" min="0" max="31"></div>
      </div></section>
      <section class="statSection natureSection"><h3>性格</h3><select id="natureSelect"></select></section>
    </div>
    <div class="actions bottomActions"><button id="applyBtn" class="btn primary">編集を反映</button><button id="resetInputsBtn" class="btn">現在値に戻す</button></div>
    <div id="applyStatus" class="status"></div>
  </div>
  <div class="saveBar"><button id="downloadBtn" class="btn primary" disabled>編集済み .sav を保存</button><div id="editStatus" class="status">変更はまだありません。</div></div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
let ROM=null,SAV=null,originalName='save.sav',speciesNames=[],party=[],selectedIndex=-1,editCount=0;
const cmapRows=[
"　あいうえおかきくけこさしすせそ","たちつてとなにぬねのはひふへほま",
"みむめもやゆよらりるれろわをんぁ","ぃぅぇぉゃゅょがぎぐげござじずぜ",
"ぞだぢづでどばびぶべぼぱぴぷぺぽ","っアイウエオカキクケコサシスセソ",
"タチツテトナニヌネノハヒフヘホマ","ミムメモヤユヨラリルレロワヲンァ",
"ィゥェォャュョガギグゲゴザジズゼ","ゾダヂヅデドバビブベボパピプペポ",
"ッ０１２３４５６７８９！？。ー・","‥『』「」♂♀円．×／ＡＢＣＤＥ",
"ＦＧＨＩＪＫＬＭＮＯＰＱＲＳＴＵ","ＶＷＸＹＺａｂｃｄｅｆｇｈｉｊｋ",
"ｌｍｎｏｐｑｒｓｔｕｖｗｘｙｚ►"];
const CMAP={}; cmapRows.forEach((r,y)=>[...r].forEach((c,x)=>CMAP[(y<<4)|x]=c));
const NATURES=["がんばりや","さみしがり","ゆうかん","いじっぱり","やんちゃ",
"ずぶとい","すなお","のんき","わんぱく","のうてんき",
"おくびょう","せっかち","まじめ","ようき","むじゃき",
"ひかえめ","おっとり","れいせい","てれや","うっかりや",
"おだやか","おとなしい","なまいき","しんちょう","きまぐれ"];
let genderRatios=[];


function u16(a,o){return (a[o]|a[o+1]<<8)>>>0}
function u32(a,o){return (a[o]|a[o+1]<<8|a[o+2]<<16|a[o+3]<<24)>>>0}
function w16(a,o,v){a[o]=v&255;a[o+1]=(v>>>8)&255}
function w32(a,o,v){v=v>>>0;a[o]=v&255;a[o+1]=(v>>>8)&255;a[o+2]=(v>>>16)&255;a[o+3]=(v>>>24)&255}
function calcSectionChecksum(a,off){
  // この改造ROMの手持ちセクション(ID 1)は、フッタ直前までを
  // 32bit加算し、上位16bitと下位16bitを加算した値を使う。
  let sum=0>>>0;
  for(let p=off;p<off+0xFEC;p+=4) sum=(sum+u32(a,p))>>>0;
  return (((sum>>>16)+(sum&0xFFFF))&0xFFFF)>>>0;
}
function updateSectionChecksum(sec){
  const cs=calcSectionChecksum(SAV,sec.off);
  w16(SAV,sec.off+0xFF6,cs);
  return cs;
}
function decText(a,o,len){
  let s=''; for(let i=0;i<len;i++){const b=a[o+i]; if(b===255)break; s+=CMAP[b]??''} return s.trim();
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function speciesName(id){return speciesNames[id]||`内部ID ${id}`}

function parseRom(){
  const code=new TextDecoder('ascii').decode(ROM.slice(0xAC,0xB0));
  if(code!=='BPRJ') throw Error('このROMはBPRJとして認識できません。');
  const base=0x16570A4, names=[];
  for(let id=0;id<2000;id++){
    const o=base+id*8;if(o+8>ROM.length)break;
    const n=decText(ROM,o,8);
    if(id>0 && !n)break;
    names[id]=n||'';
  }
  speciesNames=names;
  genderRatios=[];
  const statsBase=0x19B8B40;
  for(let id=0;id<names.length;id++){
    const o=statsBase+id*32;
    genderRatios[id]=(o+16<ROM.length)?ROM[o+16]:255;
  }
  return names.filter(Boolean).length;
}

function getSaveSectors(){
  const sectors=[];
  for(let s=0;s<Math.floor(SAV.length/0x1000);s++){
    const o=s*0x1000;
    if(u32(SAV,o+0xFF8)!==0x08012025)continue;
    sectors.push({phys:s,off:o,id:u16(SAV,o+0xFF4),counter:u32(SAV,o+0xFFC)});
  }
  return sectors;
}

function currentSection1(){
  const secs=getSaveSectors().filter(x=>x.id===1);
  if(!secs.length)throw Error('セーブ内の手持ち領域を検出できません。');
  secs.sort((a,b)=>b.counter-a.counter);
  return secs[0];
}

function parsePartyFrom(sec){
  const count=u32(SAV,sec.off+0x34);
  if(count<0||count>6)throw Error(`手持ち数が異常です: ${count}`);
  const arr=[];
  for(let i=0;i<count;i++){
    const o=sec.off+0x38+i*100;
    const personality=u32(SAV,o),otid=u32(SAV,o+4);
    const nickname=decText(SAV,o+8,10);
    const species=u16(SAV,o+32);
    const level=SAV[o+84];
    const raw=[SAV[o+56],SAV[o+57],SAV[o+58],SAV[o+59],SAV[o+60],SAV[o+61]]; // H,A,B,S,C,D
    const friendship=SAV[o+41];
    const ivWord=u32(SAV,o+72);
    const ivRaw=[
      (ivWord>>>0)&31,(ivWord>>>5)&31,(ivWord>>>10)&31,
      (ivWord>>>15)&31,(ivWord>>>20)&31,(ivWord>>>25)&31
    ]; // H,A,B,S,C,D
    arr.push({i,o,personality,otid,nickname,species,level,raw,friendship,ivWord,
      nature:personality%25,
      ev:{H:raw[0],A:raw[1],B:raw[2],S:raw[3],C:raw[4],D:raw[5]},
      iv:{H:ivRaw[0],A:ivRaw[1],B:ivRaw[2],S:ivRaw[3],C:ivRaw[4],D:ivRaw[5]}});
  }
  return arr;
}

function refreshParty(){
  const sec=currentSection1();
  party=parsePartyFrom(sec);
  const list=$('monList'); list.innerHTML='';
  party.forEach((m,idx)=>{
    const total=Object.values(m.ev).reduce((a,b)=>a+b,0);
    const b=document.createElement('button');
    b.className='mon'+(idx===selectedIndex?' active':'');
    b.innerHTML=`<div class="name">${esc(speciesName(m.species))} <span style="font-size:15px;color:#aeb9d6">Lv${m.level}</span></div>
      <div class="meta">${m.nickname&&m.nickname!==speciesName(m.species)?`NN: ${esc(m.nickname)}　`:''}
      性格:${NATURES[m.nature]}　EV H${m.ev.H} A${m.ev.A} B${m.ev.B} C${m.ev.C} D${m.ev.D} S${m.ev.S}　計${total}<br>
      IV H${m.iv.H} A${m.iv.A} B${m.iv.B} C${m.iv.C} D${m.iv.D} S${m.iv.S}　なつき度 ${m.friendship}</div>`;
    b.onclick=()=>selectMon(idx);
    list.appendChild(b);
  });
  $('main').classList.remove('hidden');
}

function selectMon(idx){
  selectedIndex=idx; refreshParty();
  const m=party[idx];
  $('editorCard').classList.remove('hidden');
  $('selectedTitle').textContent=`${speciesName(m.species)} Lv${m.level}`;
  $('selectedMeta').textContent=`手持ち${idx+1} / 種族ID ${m.species}${m.nickname&&m.nickname!==speciesName(m.species)?` / NN: ${m.nickname}`:''}`;
  setInputs(m.ev);
  setIvInputs(m.iv);
  $('natureSelect').value=String(m.nature);
  $('friendship').value=String(m.friendship);
  $('applyStatus').textContent='';
}

function setInputs(ev){
  for(const k of ['H','A','B','C','D','S']) $('ev'+k).value=ev[k];
  updateTotal();
}
function readInputs(){
  const ev={};
  for(const k of ['H','A','B','C','D','S']){
    let v=Number($('ev'+k).value);
    if(!Number.isFinite(v))v=0;
    ev[k]=Math.max(0,Math.min(252,Math.trunc(v)));
  }
  return ev;
}
function updateTotal(){
  const ev=readInputs(),total=Object.values(ev).reduce((a,b)=>a+b,0);
  $('evTotal').textContent=total;
  $('evRemain').textContent=Math.max(0,510-total);
  $('evTotal').style.color=total>510?'#ff9090':'';
  return total;
}
['H','A','B','C','D','S'].forEach(k=>$('ev'+k).addEventListener('input',updateTotal));
$('natureSelect').innerHTML=NATURES.map((n,i)=>`<option value="${i}">${n}</option>`).join('');



function setIvInputs(iv){
  for(const k of ['H','A','B','C','D','S']) $('iv'+k).value=iv[k];
}
function readIvInputs(){
  const iv={};
  for(const k of ['H','A','B','C','D','S']){
    let v=Number($('iv'+k).value);
    if(!Number.isFinite(v))v=0;
    iv[k]=Math.max(0,Math.min(31,Math.trunc(v)));
  }
  return iv;
}
function makeIvWord(oldWord,iv){
  let v=(oldWord & 0xC0000000)>>>0; // タマゴ/特性ビットを維持
  v|=(iv.H&31);
  v|=(iv.A&31)<<5;
  v|=(iv.B&31)<<10;
  v|=(iv.S&31)<<15;
  v|=(iv.C&31)<<20;
  v|=(iv.D&31)<<25;
  return v>>>0;
}
function genderClass(pid,ratio){
  if(ratio===255)return 'genderless';
  if(ratio===254)return 'female';
  if(ratio===0)return 'male';
  return ((pid&255)<ratio)?'female':'male';
}
function isShiny(pid,otid){
  const tid=otid&0xFFFF,sid=(otid>>>16)&0xFFFF;
  const lo=pid&0xFFFF,hi=(pid>>>16)&0xFFFF;
  return ((tid^sid^lo^hi)&0xFFFF)<8;
}
function pidForNature(oldPid,desiredNature,species,otid){
  desiredNature=Number(desiredNature);
  if((oldPid%25)===desiredNature)return oldPid>>>0;
  const ratio=genderRatios[species]??255;
  const oldGender=genderClass(oldPid,ratio),oldShiny=isShiny(oldPid,otid);
  const base=(oldPid - (oldPid%25) + desiredNature)>>>0;
  let best=null,bestDist=Infinity;
  // 同じ性別・色違い状態を維持できるPIDを近傍から探索。
  for(let k=0;k<=20000;k++){
    for(const sign of (k===0?[1]:[1,-1])){
      const cand=(base + sign*k*25)>>>0;
      if(cand%25!==desiredNature)continue;
      if(genderClass(cand,ratio)!==oldGender)continue;
      if(isShiny(cand,otid)!==oldShiny)continue;
      const dist=Math.abs((cand>>>0)-(oldPid>>>0));
      if(dist<bestDist){best=cand;bestDist=dist}
      if(k>200 && best!==null)return best>>>0;
    }
  }
  if(best!==null)return best>>>0;
  throw Error('性別・色違い状態を維持した性格値を見つけられませんでした。');
}
function currentPartyRecord(target){
  const sec=currentSection1();
  const count=u32(SAV,sec.off+0x34);
  if(count<1||count>6)return null;
  for(let i=0;i<count;i++){
    const o=sec.off+0x38+i*100;
    if(u32(SAV,o)===target.personality &&
       u32(SAV,o+4)===target.otid &&
       u16(SAV,o+32)===target.species){
      return {sec,o,i};
    }
  }
  return null;
}

$('applyBtn').onclick=()=>{
  if(selectedIndex<0)return;
  const ev=readInputs(),total=Object.values(ev).reduce((a,b)=>a+b,0);
  if(total>510){$('applyStatus').innerHTML='<span class="warn">合計510を超えています。</span>';return;}
  const m=party[selectedIndex],hit=currentPartyRecord(m);
  if(!hit){$('applyStatus').innerHTML='<span class="warn">最新セーブ側で対象個体を再検出できませんでした。</span>';return;}

  const iv=readIvInputs();
  const desiredNature=Number($('natureSelect').value);
  let friendship=Number($('friendship').value);
  if(!Number.isFinite(friendship) || friendship<0 || friendship>255){
    $('applyStatus').innerHTML='<span class="warn">なつき度は0〜255で指定してください。</span>';
    return;
  }
  friendship=Math.trunc(friendship);

  // 最新のセーブスロットだけを書き換える。古いスロットはバックアップとして残す。
  SAV[hit.o+56]=ev.H; SAV[hit.o+57]=ev.A; SAV[hit.o+58]=ev.B;
  SAV[hit.o+59]=ev.S; SAV[hit.o+60]=ev.C; SAV[hit.o+61]=ev.D;
  SAV[hit.o+41]=friendship;

  // 個体値。上位2bit（タマゴ/特性スロット）はそのまま保持。
  const newIvWord=makeIvWord(u32(SAV,hit.o+72),iv);
  w32(SAV,hit.o+72,newIvWord);

  // 性格はPID%25で決まる。このROMの実データでも一致を確認済み。
  // 性別と色違い状態を変えないPIDを選ぶ。
  let newPid=m.personality;
  try{newPid=pidForNature(m.personality,desiredNature,m.species,m.otid)}
  catch(err){$('applyStatus').innerHTML=`<span class="warn">${esc(err.message)}</span>`;return;}
  w32(SAV,hit.o,newPid);

  const newCs=updateSectionChecksum(hit.sec);
  const storedCs=u16(SAV,hit.sec.off+0xFF6);
  const verifyCs=calcSectionChecksum(SAV,hit.sec.off);

  if(storedCs!==verifyCs){
    $('applyStatus').innerHTML=`<span class="warn">チェックサム検証に失敗しました。保存しないでください。 stored=${storedCs} calc=${verifyCs}</span>`;
    $('downloadBtn').disabled=true;
    return;
  }

  editCount++;
  $('downloadBtn').disabled=false;
  $('editStatus').innerHTML=`<span class="ok">変更 ${editCount}件。最新セーブ(counter ${hit.sec.counter})だけを書き換え、チェックサム検証も通過しました。</span>`;
  $('applyStatus').innerHTML=`<span class="ok">EV・個体値・性格・なつき度を上書きしました。 checksum=${newCs} ✓</span>`;
  refreshParty(); selectMon(selectedIndex);
};

$('resetInputsBtn').onclick=()=>{if(selectedIndex>=0){const m=party[selectedIndex];setInputs(m.ev);setIvInputs(m.iv);$('natureSelect').value=String(m.nature);$('friendship').value=String(m.friendship)}};

$('downloadBtn').onclick=()=>{
  const blob=new Blob([SAV],{type:'application/octet-stream'});
  const a=document.createElement('a');
  const stem=originalName.replace(/\.sav$/i,'');
  a.href=URL.createObjectURL(blob);
  a.download=stem+'_edited.sav';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};

$('romFile').addEventListener('change',async e=>{
  try{
    const f=e.target.files[0]; if(!f)return;
    ROM=new Uint8Array(await f.arrayBuffer());
    const n=parseRom();
    $('romStatus').innerHTML=`<span class="ok">読込OK：${esc(f.name)}<br>種族名 ${n}件を検出</span>`;
    if(SAV)refreshParty();
  }catch(err){$('romStatus').innerHTML=`<span class="warn">${esc(err.message)}</span>`}
});

$('savFile').addEventListener('change',async e=>{
  try{
    const f=e.target.files[0];if(!f)return;
    originalName=f.name;
    SAV=new Uint8Array(await f.arrayBuffer());
    if(SAV.length!==131072)throw Error(`想定外のセーブサイズです: ${SAV.length} bytes`);
    const sec=currentSection1(),p=parsePartyFrom(sec);
    $('savStatus').innerHTML=`<span class="ok">読込OK：${esc(f.name)}<br>使用セーブ counter=${sec.counter} / 手持ち${p.length}匹</span>`;
    if(ROM)refreshParty();
  }catch(err){$('savStatus').innerHTML=`<span class="warn">${esc(err.message)}</span>`}
});
</script>
