<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>v0.23 PC・どうぐ修復ツール</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4efd9;color:#2f3421;font-family:"DotGothic16","MS Gothic",monospace}
.wrap{max-width:760px;margin:auto;padding:18px}
.card{background:#fffdf0;border:4px solid #64731c;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 5px 0 rgba(83,98,16,.18)}
h1{font-size:24px;margin:0 0 10px}
.sub,.note{line-height:1.65;font-size:14px}
input{display:block;width:100%;margin-top:12px}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#64731c;color:white;font:inherit;font-weight:bold;font-size:17px}
button:disabled{opacity:.45}
.status{margin-top:10px;overflow-wrap:anywhere}
.ok{color:#287542;font-weight:bold}
.bad{color:#b13232;font-weight:bold}
code{font-family:monospace}
</style>
</head>
<body>
<div class="wrap">
<section class="card">
<h1>v0.23 PC・どうぐ修復ツール v7</h1>
<div class="sub">
今の「手持ち・大切なもの・ボールが正常」なv0.23セーブを土台にして、<br>
① PC/BOXを空の正常状態へリセット<br>
② 「どうぐ」に4種類を復元（保存先を修正）<br>
します。
</div>
</section>

<section class="card">
<b>① 現在の v0.23 セーブ</b>
<input id="file" type="file" accept=".sav,application/octet-stream">
<div id="status" class="status">未読込</div>
</section>

<section class="card">
<div class="note">
復元する「どうぐ」：<b>リザードナイトX ×1 / リザードナイトY ×1 / どくけし ×1 / キズぐすり ×1</b><br>
PC/BOXの中身は空になります。手持ち・ストーリー・大切なもの・ボールは変更しません。前回のテストでPCが開くことを確認できた修復方法をそのまま使います。
</div>
<button id="run" disabled>修復した .sav を保存</button>
<div id="result" class="status"></div>
</section>
</div>

<script>
const SIG=0x08012025, SECTOR=0x1000, SIZE=0x20000;
const PC_TEMPLATE_B64="AAAAAAwNAAEAAQQFBAUIAJqgWF2jp/8AAJqgWF2jqP8AAJqgWF2jqf8AAJqgWF2jqv8AAJqgWF2kof8AAJqgWF2kov8AAJqgWF2ko/8AAJqgWF2kpP8AAJqgWF2kpf8AAJqgWF2kpv8AAJqgWF2kp/8AAJqgWF2kqP8AAJqgWF2kqf8AAJqgWF2kqv8AAAkICQwNDA0AAQABBAUEmqBYXaOm/wAAmqBYXaOl/wAAmqBYXaOk/wAAmqBYXaOj/wAAmqBYXaOi/wAAmqBYXaOh/wAAmqBYXaKq/wAAmqBYXaKp/wAAmqBYXaKo/wAAmqBYXaKn/wAAmqBYXaKm/wAAmqBYXaL/AAAAmqBYXaP/AAAAmqBYXaT/AAAAmqBYXaX/AAAAmqBYXab/AAAAmqBYXaf/AAAAmqBYXaj/AAAAmqBYXan/AAAAmqBYXar/AAAAmqBYXaKh/wAAmqBYXaKi/wAAmqBYXaKj/wAAmqBYXaKk/wAAmqBYXaKl/wAAAAEAAQQFBAUICQgJDA0AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQJREQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==";
const ITEM_BASE=0x298;
const ITEMS=[[534,1],[535,1],[14,1],[13,1]];
let data=null;

const $=id=>document.getElementById(id);
const u16=(a,o)=>a[o]|(a[o+1]<<8);
const u32=(a,o)=>(a[o]|(a[o+1]<<8)|(a[o+2]<<16)|(a[o+3]<<24))>>>0;
function w16(a,o,v){a[o]=v&255;a[o+1]=(v>>>8)&255}
function checksum(a,o){
 let s=0;
 for(let i=0;i<0xFF4;i+=4)s=(s+u32(a,o+i))>>>0;
 return (((s>>>16)+(s&0xFFFF))&0xFFFF)>>>0;
}
function sections(a,id){
 const r=[];
 for(let i=0;i<32;i++){
  const o=i*SECTOR;
  if(u32(a,o+0xFF8)===SIG && u16(a,o+0xFF4)===id)
   r.push({off:o,phys:i,ctr:u32(a,o+0xFFC)});
 }
 r.sort((x,y)=>x.ctr-y.ctr);
 return r;
}
function b64bytes(s){
 const bin=atob(s), a=new Uint8Array(bin.length);
 for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
 return a;
}

$('file').addEventListener('change',async e=>{
 try{
  const f=e.target.files[0]; if(!f)return;
  data=new Uint8Array(await f.arrayBuffer());
  if(data.length!==SIZE)throw new Error('128KBの .sav ではありません');
  const s40=sections(data,0x40), s1=sections(data,1);
  if(!s40.length)throw new Error('PC/BOXセクション 0x40 が見つかりません');
  if(!s1.length)throw new Error('メインセクション1が見つかりません');
  $('status').innerHTML=`<span class="ok">OK</span>　0x40: ${s40.length}世代 / セクション1最新世代: ${s1[s1.length-1].ctr}`;
  $('run').disabled=false;
 }catch(err){
  data=null;$('run').disabled=true;
  $('status').innerHTML=`<span class="bad">エラー：</span>${err.message}`;
 }
});

$('run').addEventListener('click',()=>{
 try{
  if(!data)throw new Error('セーブを読み込んでください');
  const out=new Uint8Array(data);
  const tmpl=b64bytes(PC_TEMPLATE_B64);

  // PC/BOX: 既知の正常な空BOXテンプレートで0x40 payloadを修復。
  // footerのID/署名/世代番号は現在のv0.23側を維持する。
  const s40=sections(out,0x40);
  for(const s of s40){
    out.set(tmpl,s.off);
    w16(out,s.off+0xFF6,checksum(out,s.off));
  }

  // どうぐ4種は 0x4F ではなく、現在世代のセクション1 +0x298 に保存される。
  // PC修復で確認済みのv0.23セーブを土台に、通常どうぐポケット先頭4枠へ復元する。
  const s1=sections(out,1);
  const bag=s1[s1.length-1];
  for(let i=0;i<ITEMS.length;i++){
    const [id,qty]=ITEMS[i], p=bag.off+ITEM_BASE+i*4;
    w16(out,p,id); w16(out,p+2,qty);
  }
  w16(out,bag.off+0xFF6,checksum(out,bag.off));

  const blob=new Blob([out],{type:'application/octet-stream'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='PokemonStart_v0.23_PC_and_items_fixed.sav';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
  $('result').innerHTML='<span class="ok">修復完了。</span> まずPCが開くか → どうぐ4種 → 大切なもの/ボール → 手持ちの順で確認してください。';
 }catch(err){
  $('result').innerHTML=`<span class="bad">失敗：</span>${err.message}`;
 }
});
</script>
</body>
</html>
