<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>改造ファイアレッド 努力値編集 v5</title>
<style>
:root{color-scheme:dark;--bg:#08101f;--panel:#101a2d;--line:#2b3a58;--text:#eef3ff;--muted:#aeb9d6;--ok:#7ee2a8;--warn:#ffd479;--accent:#dfe7ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif}
.wrap{max-width:900px;margin:auto;padding:24px 14px calc(40px + env(safe-area-inset-bottom))}
h1{font-size:28px;line-height:1.25;margin:0 0 8px}
.sub{color:var(--muted);line-height:1.7;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;margin:14px 0}
.loadgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.filebox{border:1px dashed #485b82;border-radius:16px;padding:16px}
.filebox b{display:block;font-size:18px;margin-bottom:10px}
input[type=file]{max-width:100%;font-size:16px}
.status{margin-top:10px;color:var(--muted);white-space:pre-wrap;line-height:1.55}
.ok{color:var(--ok)}
.warn{color:var(--warn)}
.list{display:grid;gap:10px}
.mon{width:100%;text-align:left;background:#0d1728;border:1px solid var(--line);border-radius:16px;padding:14px;color:var(--text)}
.mon.active{outline:2px solid var(--accent)}
.mon .name{font-size:22px;font-weight:800}
.meta{color:var(--muted);margin-top:5px;line-height:1.45}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ev{background:#0d1728;border:1px solid var(--line);border-radius:16px;padding:12px}
.ev label{display:block;color:var(--muted);font-weight:700;margin-bottom:8px}
.ev input{width:100%;font-size:26px;font-weight:800;padding:10px;border-radius:12px;border:1px solid #405174;background:#08111f;color:var(--text)}
.summary{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.pill{background:#0d1728;border:1px solid var(--line);border-radius:999px;padding:8px 12px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
button{font:inherit}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:800;background:#2b3957;color:white}
.btn.primary{background:var(--accent);color:#101522}
.btn.danger{background:#5a2630}
.btn:disabled{opacity:.45}
.note{font-size:14px;color:var(--muted);line-height:1.6;margin-top:12px}
.hidden{display:none!important}
@media(max-width:700px){
  .loadgrid{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(2,1fr)}
  h1{font-size:25px}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>改造ファイアレッド 努力値編集 <span style="font-size:14px;color:#a5b4fc">v5</span></h1>
  <div class="sub">このROM専用の手持ち努力値エディタです。実際のセーブ構造を基準に、現在EVを読み取り、H/A/B/C/D/Sを指定値へ上書きします。</div>

  <div class="card loadgrid">
    <div class="filebox">
      <b>① ROM (.gba)</b>
      <input id="romFile" type="file" accept=".gba,application/octet-stream">
      <div id="romStatus" class="status">未読込</div>
    </div>
    <div class="filebox">
      <b>② セーブ (.sav)</b>
      <input id="savFile" type="file" accept=".sav,application/octet-stream">
      <div id="savStatus" class="status">未読込</div>
    </div>
  </div>

  <div id="main" class="hidden">
    <div class="card">
      <h2 style="margin-top:0">手持ち</h2>
      <div id="monList" class="list"></div>
    </div>

    <div id="editorCard" class="card hidden">
      <div id="selectedTitle" style="font-size:28px;font-weight:900"></div>
      <div id="selectedMeta" class="meta"></div>

      <div class="grid" style="margin-top:16px">
        <div class="ev"><label>H 努力値</label><input id="evH" inputmode="numeric" type="number" min="0" max="252"></div>
        <div class="ev"><label>A 努力値</label><input id="evA" inputmode="numeric" type="number" min="0" max="252"></div>
        <div class="ev"><label>B 努力値</label><input id="evB" inputmode="numeric" type="number" min="0" max="252"></div>
        <div class="ev"><label>C 努力値</label><input id="evC" inputmode="numeric" type="number" min="0" max="252"></div>
        <div class="ev"><label>D 努力値</label><input id="evD" inputmode="numeric" type="number" min="0" max="252"></div>
        <div class="ev"><label>S 努力値</label><input id="evS" inputmode="numeric" type="number" min="0" max="252"></div>
      </div>

      <div class="summary">
        <div class="pill">合計 <b id="evTotal">0</b> / 510</div>
        <div class="pill">残り <b id="evRemain">510</b></div>
      </div>

      <div class="actions">
        <button id="applyBtn" class="btn primary">この値に上書き</button>
        <button id="resetInputsBtn" class="btn">現在値に戻す</button>
      </div>
      <div id="applyStatus" class="status"></div>
    </div>

    <div class="card">
      <div class="actions">
        <button id="downloadBtn" class="btn primary" disabled>編集済み .sav を保存</button>
      </div>
      <div id="editStatus" class="status">変更はまだありません。</div>
      <div class="note">
        ※ 元の .sav は変更しません。必ず別ファイルとして保存します。<br>
        ※ 1能力は0〜252、合計は510までです。<br>
        ※ 今回は手持ちのみ対応。BOXは構造が別なので、誤編集防止のため未対応にしています。
      </div>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let ROM=null,SAV=null,originalName='save.sav',speciesNames=[],party=[],selectedIndex=-1,editCount=0;
const cmapRows=[
"　あいうえおかきくけこさしすせそ","たちつてとなにぬねのはひふへほま",
"みむめもやゆよらりるれろわをんぁ","ぃぅぇぉゃゅょがぎぐげござじずぜ",
"ぞだぢづでどばびぶべぼぱぴぷぺぽ","っアイウエオカキクケコサシスセソ",
"タチツテトナニヌネノハヒフヘホマ","ミムメモヤユヨラリルレロワヲンァ",
"ィゥェォャュョガギグゲゴザジズゼ","ゾダヂヅデドバビブベボパピプペポ",
"ッ０１２３４５６７８９！？。ー・","‥『』「」♂♀円．×／ＡＢＣＤＥ",
"ＦＧＨＩＪＫＬＭＮＯＰＱＲＳＴＵ","ＶＷＸＹＺａｂｃｄｅｆｇｈｉｊｋ",
"ｌｍｎｏｐｑｒｓｔｕｖｗｘｙｚ►"];
const CMAP={}; cmapRows.forEach((r,y)=>[...r].forEach((c,x)=>CMAP[(y<<4)|x]=c));

function u16(a,o){return (a[o]|a[o+1]<<8)>>>0}
function u32(a,o){return (a[o]|a[o+1]<<8|a[o+2]<<16|a[o+3]<<24)>>>0}
function decText(a,o,len){
  let s=''; for(let i=0;i<len;i++){const b=a[o+i]; if(b===255)break; s+=CMAP[b]??''} return s.trim();
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function speciesName(id){return speciesNames[id]||`内部ID ${id}`}

function parseRom(){
  const code=new TextDecoder('ascii').decode(ROM.slice(0xAC,0xB0));
  if(code!=='BPRJ') throw Error('このROMはBPRJとして認識できません。');
  const base=0x16570A4, names=[];
  for(let id=0;id<2000;id++){
    const o=base+id*8;if(o+8>ROM.length)break;
    const n=decText(ROM,o,8);
    if(id>0 && !n)break;
    names[id]=n||'';
  }
  speciesNames=names;
  return names.filter(Boolean).length;
}

function getSaveSectors(){
  const sectors=[];
  for(let s=0;s<Math.floor(SAV.length/0x1000);s++){
    const o=s*0x1000;
    if(u32(SAV,o+0xFF8)!==0x08012025)continue;
    sectors.push({phys:s,off:o,id:u16(SAV,o+0xFF4),counter:u32(SAV,o+0xFFC)});
  }
  return sectors;
}

function currentSection1(){
  const secs=getSaveSectors().filter(x=>x.id===1);
  if(!secs.length)throw Error('セーブ内の手持ち領域を検出できません。');
  secs.sort((a,b)=>b.counter-a.counter);
  return secs[0];
}

function parsePartyFrom(sec){
  const count=u32(SAV,sec.off+0x34);
  if(count<0||count>6)throw Error(`手持ち数が異常です: ${count}`);
  const arr=[];
  for(let i=0;i<count;i++){
    const o=sec.off+0x38+i*100;
    const personality=u32(SAV,o),otid=u32(SAV,o+4);
    const nickname=decText(SAV,o+8,10);
    const species=u16(SAV,o+32);
    const level=SAV[o+84];
    const raw=[SAV[o+56],SAV[o+57],SAV[o+58],SAV[o+59],SAV[o+60],SAV[o+61]]; // H,A,B,S,C,D
    arr.push({i,o,personality,otid,nickname,species,level,raw,
      ev:{H:raw[0],A:raw[1],B:raw[2],S:raw[3],C:raw[4],D:raw[5]}});
  }
  return arr;
}

function refreshParty(){
  const sec=currentSection1();
  party=parsePartyFrom(sec);
  const list=$('monList'); list.innerHTML='';
  party.forEach((m,idx)=>{
    const total=Object.values(m.ev).reduce((a,b)=>a+b,0);
    const b=document.createElement('button');
    b.className='mon'+(idx===selectedIndex?' active':'');
    b.innerHTML=`<div class="name">${esc(speciesName(m.species))} <span style="font-size:15px;color:#aeb9d6">Lv${m.level}</span></div>
      <div class="meta">${m.nickname&&m.nickname!==speciesName(m.species)?`NN: ${esc(m.nickname)}　`:''}
      H${m.ev.H} A${m.ev.A} B${m.ev.B} C${m.ev.C} D${m.ev.D} S${m.ev.S}　計${total}</div>`;
    b.onclick=()=>selectMon(idx);
    list.appendChild(b);
  });
  $('main').classList.remove('hidden');
}

function selectMon(idx){
  selectedIndex=idx; refreshParty();
  const m=party[idx];
  $('editorCard').classList.remove('hidden');
  $('selectedTitle').textContent=`${speciesName(m.species)} Lv${m.level}`;
  $('selectedMeta').textContent=`手持ち${idx+1} / 種族ID ${m.species}${m.nickname&&m.nickname!==speciesName(m.species)?` / NN: ${m.nickname}`:''}`;
  setInputs(m.ev);
  $('applyStatus').textContent='';
}

function setInputs(ev){
  for(const k of ['H','A','B','C','D','S']) $('ev'+k).value=ev[k];
  updateTotal();
}
function readInputs(){
  const ev={};
  for(const k of ['H','A','B','C','D','S']){
    let v=Number($('ev'+k).value);
    if(!Number.isFinite(v))v=0;
    ev[k]=Math.max(0,Math.min(252,Math.trunc(v)));
  }
  return ev;
}
function updateTotal(){
  const ev=readInputs(),total=Object.values(ev).reduce((a,b)=>a+b,0);
  $('evTotal').textContent=total;
  $('evRemain').textContent=Math.max(0,510-total);
  $('evTotal').style.color=total>510?'#ff9090':'';
  return total;
}
['H','A','B','C','D','S'].forEach(k=>$('ev'+k).addEventListener('input',updateTotal));

function matchingPartyRecords(target){
  const hits=[];
  for(const sec of getSaveSectors().filter(x=>x.id===1)){
    const count=u32(SAV,sec.off+0x34);
    if(count<1||count>6)continue;
    for(let i=0;i<count;i++){
      const o=sec.off+0x38+i*100;
      if(u32(SAV,o)===target.personality && u32(SAV,o+4)===target.otid && u16(SAV,o+32)===target.species){
        hits.push({sec,o,i});
      }
    }
  }
  return hits;
}

$('applyBtn').onclick=()=>{
  if(selectedIndex<0)return;
  const ev=readInputs(),total=Object.values(ev).reduce((a,b)=>a+b,0);
  if(total>510){$('applyStatus').innerHTML='<span class="warn">合計510を超えています。</span>';return;}
  const m=party[selectedIndex],hits=matchingPartyRecords(m);
  if(!hits.length){$('applyStatus').innerHTML='<span class="warn">対象個体をセーブ内で再検出できませんでした。</span>';return;}
  for(const h of hits){
    SAV[h.o+56]=ev.H; SAV[h.o+57]=ev.A; SAV[h.o+58]=ev.B;
    SAV[h.o+59]=ev.S; SAV[h.o+60]=ev.C; SAV[h.o+61]=ev.D;
  }
  editCount++;
  $('downloadBtn').disabled=false;
  $('editStatus').innerHTML=`<span class="ok">変更 ${editCount}件。セーブ内の同一個体 ${hits.length}コピーへ反映済み。</span>`;
  $('applyStatus').innerHTML='<span class="ok">指定値へ上書きしました。</span>';
  refreshParty(); selectMon(selectedIndex);
};

$('resetInputsBtn').onclick=()=>{if(selectedIndex>=0)setInputs(party[selectedIndex].ev)};

$('downloadBtn').onclick=()=>{
  const blob=new Blob([SAV],{type:'application/octet-stream'});
  const a=document.createElement('a');
  const stem=originalName.replace(/\.sav$/i,'');
  a.href=URL.createObjectURL(blob);
  a.download=stem+'_ev_edited.sav';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};

$('romFile').addEventListener('change',async e=>{
  try{
    const f=e.target.files[0]; if(!f)return;
    ROM=new Uint8Array(await f.arrayBuffer());
    const n=parseRom();
    $('romStatus').innerHTML=`<span class="ok">読込OK：${esc(f.name)}<br>種族名 ${n}件を検出</span>`;
    if(SAV)refreshParty();
  }catch(err){$('romStatus').innerHTML=`<span class="warn">${esc(err.message)}</span>`}
});

$('savFile').addEventListener('change',async e=>{
  try{
    const f=e.target.files[0];if(!f)return;
    originalName=f.name;
    SAV=new Uint8Array(await f.arrayBuffer());
    if(SAV.length!==131072)throw Error(`想定外のセーブサイズです: ${SAV.length} bytes`);
    const sec=currentSection1(),p=parsePartyFrom(sec);
    $('savStatus').innerHTML=`<span class="ok">読込OK：${esc(f.name)}<br>使用セーブ counter=${sec.counter} / 手持ち${p.length}匹</span>`;
    if(ROM)refreshParty();
  }catch(err){$('savStatus').innerHTML=`<span class="warn">${esc(err.message)}</span>`}
});
</script>
</body>
</html>
